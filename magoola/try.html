<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Gallery</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: #fff;
    }

    h1 {
        text-align: center;
        padding: 20px;
    }

    .video-gallery {
        max-width: 1200px;
        margin: auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        padding: 20px;
    }

    .video-card {
        background: #1e1e1e;
        border-radius: 10px;
        overflow: hidden;
        transition: transform 0.3s;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .video-card:hover {
        transform: scale(1.05);
    }

    video {
        width: 100%;
        height: 200px;
        object-fit: cover;
    }

    .video-title {
        padding: 10px;
        text-align: center;
        font-size: 14px;
        background: #222;
    }
</style>
</head>
<body>


    <div class="video-card">
        <video controls>
            <source src="video2.mp4" type="video/mp4">
        </video>
        <div class="video-title">Video Two</div>
    </div>

    <div class="video-card">
        <video controls>
            <source src="video.mp3" type="video/mp4">
        </video>
        <div class="video-title">Video Three</div>
    </div>

    <div class="video-card">
        <video controls>
            <source src="video4.mp4" type="video/mp4">
        </video>
        <div class="video-title">Video Four</div>
    </div>

</div>

</body>
</html>
